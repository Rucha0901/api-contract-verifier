spec_version: "0.1.0"
name: api-contract-verifier
version: 1.0.0
description: Openapi/asyncapi contract conformity checking, breaking change detection, and payload fuzz testing.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - spectral-linter-validation
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - testing
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/api-contract-verifier"
